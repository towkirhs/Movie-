name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: set -o pipefail; gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "^e: |error:|What went wrong|Execution failed|Could not|>" build.log | head -60 | cut -c1-400; echo '```'; } > err.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@err.md
      - run: cp app/build/outputs/apk/debug/app-debug.apk MovieLive.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: MovieLive 0.1.${{ github.run_number }}
          files: MovieLive.apk
